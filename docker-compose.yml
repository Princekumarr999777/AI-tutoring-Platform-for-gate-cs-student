services:
  db:
    image: pgvector/pgvector:pg15
    environment: {POSTGRES_USER: gate, POSTGRES_PASSWORD: gate, POSTGRES_DB: gate}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U gate -d gate"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment: {DATABASE_URL: postgresql+asyncpg://gate:gate@db:5432/gate, REDIS_URL: redis://redis:6379/0}
    command: sh -c "poetry run alembic upgrade head && poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 4s, retries: 10}
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment: {DATABASE_URL: postgresql+asyncpg://gate:gate@db:5432/gate, REDIS_URL: redis://redis:6379/0}
    command: poetry run celery -A src.worker.celery_app worker --loglevel=INFO
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "celery -A src.worker.celery_app inspect ping -d celery@$$HOSTNAME"], interval: 30s, timeout: 10s, retries: 3}
  web:
    build: ./apps/web
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"], interval: 10s, timeout: 4s, retries: 10}
volumes: {pgdata: {}}
